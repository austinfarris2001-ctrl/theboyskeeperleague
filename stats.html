<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Season Stats - The Boys Keeper League</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">

  <div class="page-header">
    <h1>Season Stats</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="stats.html" class="active">Season Stats</a>
      <a href="draft.html">Draft History</a>
      <a href="keepers.html">Keepers</a>
      <a href="misses.html">Analytics</a>
    </nav>
  </div>

  <p class="empty-note" style="margin-bottom:10px;">Tap a season to toggle it on/off - select more than one to compare across years.</p>
  <div class="filter-bar" id="season-bar">
    <!-- season buttons injected by js/stats.js since seasons depend on what data actually exists -->
  </div>
  <div class="filter-bar" style="margin-top:-14px;">
    <button id="select-all-btn" class="filter-btn small-btn">Select all</button>
    <button id="deselect-all-btn" class="filter-btn small-btn">Deselect all</button>
  </div>

  <div id="view-mode-bar" class="filter-bar" style="display:none;">
    <button class="filter-btn active" data-mode="individual">Individual</button>
    <button class="filter-btn" data-mode="cumulative">Cumulative</button>
  </div>

  <div id="sort-bar" class="filter-bar" style="display:none; align-items:center;">
    <span style="font-size:13px; color:var(--text-mute);">Sort by:</span>
    <select id="sort-select" class="sort-select"></select>
  </div>

  <div id="loading-note" class="empty-note">Select at least one season above.</div>

  <div id="team-grid" class="keeper-grid"></div>

  <div id="drill-overlay" class="spotlight-overlay hidden">
    <div class="spotlight-card" style="max-width:600px;">
      <button id="close-drill" class="close-btn">&times;</button>
      <div id="drill-body"></div>
    </div>
  </div>

</div>

<script src="data/owners.js"></script>
<script src="data/espn-history.js"></script>
<script src="data/player-positions.js"></script>
<script src="data/player-names.js"></script>
<script src="js/stats.js"></script>
</body>
</html>
