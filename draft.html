<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Draft History - The Boys Keeper League</title>
<link rel="stylesheet" href="css/style.css">
<style>
.draft-board { overflow-x: auto; }
.draft-grid { display: grid; gap: 4px; min-width: fit-content; }
.draft-header-cell {
  background: var(--panel-2); border: 1.5px solid var(--border); border-radius: 8px;
  padding: 8px 6px; text-align: center; font-size: 11px; font-weight: 700; color: var(--blue);
  display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 110px;
}
.draft-round-label {
  background: var(--panel-2); border: 1.5px solid var(--border); border-radius: 8px;
  padding: 8px 6px; text-align: center; font-size: 12px; font-weight: 700; color: var(--text-mute);
  display: flex; align-items: center; justify-content: center; min-width: 40px;
}
.draft-cell {
  border: 1.5px solid var(--border); border-radius: 8px; padding: 8px 6px; min-width: 110px;
  min-height: 60px; display: flex; flex-direction: column; justify-content: center; gap: 4px;
}
.draft-cell .pick-num { font-size: 10px; color: rgba(255,255,255,0.65); }
.draft-cell .pick-player { font-size: 12px; font-weight: 700; color: var(--text); line-height: 1.2; }
.draft-cell .pick-logo { width: 18px; height: 18px; border-radius: 50%; background: #fff; padding: 1px; }
.draft-legend { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.draft-legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }
.draft-legend-swatch { width: 14px; height: 14px; border-radius: 4px; }
</style>
</head>
<body>
<div class="page">

  <div class="page-header">
    <h1>Draft History</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="stats.html">Season Stats</a>
      <a href="draft.html" class="active">Draft History</a>
      <a href="keepers.html">Keepers</a>
      <a href="misses.html">Analytics</a>
    </nav>
  </div>

  <div class="filter-bar" id="draft-season-bar"></div>
  <div class="filter-bar" id="draft-color-bar">
    <button class="filter-btn active" data-color-mode="position">Position</button>
    <button class="filter-btn" data-color-mode="value">Value (vs ADP)</button>
    <button class="filter-btn" data-color-mode="performance">Performance (VORP)</button>
  </div>

  <div id="draft-legend" class="draft-legend"></div>
  <div id="draft-loading" class="empty-note">Select a season above.</div>
  <div id="draft-board" class="draft-board"></div>

</div>

<script src="data/owners.js"></script>
<script src="data/player-positions.js"></script>
<script src="data/player-names.js"></script>
<script src="js/draft.js"></script>
</body>
</html>
