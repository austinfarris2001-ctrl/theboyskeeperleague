<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Analytics - The Boys Keeper League</title>
<link rel="stylesheet" href="css/style.css">
<style>
.h2h-table { overflow-x: auto; }
.h2h-grid { display: grid; gap: 3px; min-width: fit-content; }
.h2h-cell {
  min-width: 64px; min-height: 44px; display: flex; align-items: center; justify-content: center;
  border-radius: 6px; font-size: 12px; font-weight: 700; border: 1.5px solid var(--border);
}
.h2h-header { background: var(--panel-2); font-size: 10px; font-weight: 800; color: var(--blue); padding: 4px; text-align: center; }
.analytics-row {
  display: flex; align-items: center; gap: 12px; background: var(--panel);
  border: 2px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
}
.analytics-rank { font-size: 15px; font-weight: 800; color: var(--text-mute); width: 24px; flex-shrink: 0; }
.analytics-main { flex: 1; min-width: 0; }
.analytics-title-line { font-size: 14px; font-weight: 700; color: var(--text); }
.analytics-sub-line { font-size: 12px; color: var(--text-mute); margin-top: 2px; }
.analytics-value { font-size: 16px; font-weight: 800; flex-shrink: 0; }
.draft-board { overflow-x: auto; }
.draft-grid { display: grid; gap: 4px; min-width: fit-content; }
.draft-header-cell {
  background: var(--panel-2); border: 2px solid var(--blue); border-radius: 8px;
  padding: 6px; text-align: center; font-size: 10px; font-weight: 800; color: var(--blue);
  min-width: 100px;
}
.draft-cell {
  border: 1.5px solid var(--border); border-radius: 8px; padding: 6px; min-width: 100px;
  min-height: 48px; display: flex; flex-direction: column; justify-content: center; gap: 2px;
  background: var(--panel);
}
.draft-cell.keeper { border-color: #ffd54a; box-shadow: 0 0 8px rgba(255,213,74,0.25); }
.draft-cell .pick-num { font-size: 9px; color: var(--text-mute); }
.draft-cell .pick-player { font-size: 11px; font-weight: 700; color: var(--text); }
.draft-cell .pick-value { font-size: 10px; font-weight: 700; color: var(--green); }
.draft-cell .pick-pos {
  display: inline-block; font-size: 8px; font-weight: 800; padding: 1px 5px; border-radius: 8px;
  background: var(--panel-2); color: var(--text-mute); margin-top: 1px;
}
</style>
</head>
<body>
<div class="page">
  <div class="page-header">
    <h1>Analytics</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="stats.html">Season Stats</a>
      <a href="playoffs.html">Playoff Stats</a>
      <a href="draft.html">Draft History</a>
      <a href="keepers.html">Keepers</a>
      <a href="misses.html" class="active">Analytics</a>
    </nav>
  </div>

  <div class="filter-bar" id="analytics-tab-bar">
    <button class="filter-btn active" data-tab="misses">Best Picks</button>
    <button class="filter-btn" data-tab="draftgrades">Draft Grades</button>
    <button class="filter-btn" data-tab="luck">Luck Factor</button>
    <button class="filter-btn" data-tab="h2h">Head-to-Head</button>
    <button class="filter-btn" data-tab="tendencies">Draft Tendencies</button>
    <button class="filter-btn" data-tab="keeperhits">Keeper Hit Rate</button>
    <button class="filter-btn" data-tab="roundvalue">Value by Round</button>
    <button class="filter-btn" data-tab="consistency">Consistency</button>
    <button class="filter-btn" data-tab="optimaldraft">Optimal Draft</button>
  </div>

  <div id="analytics-loading" class="empty-note">Loading...</div>
  <div class="filter-bar" id="draftgrades-year-bar" style="display:none;"></div>
  <div class="filter-bar" id="luck-year-bar" style="display:none;"></div>
  <div class="filter-bar" id="h2h-mode-bar" style="display:none;"></div>
  <div class="filter-bar" id="optimaldraft-season-bar" style="display:none;"></div>
  <div class="filter-bar" id="optimaldraft-keepers-bar" style="display:none;"></div>
  <div id="analytics-content"></div>

</div>

<script src="data/owners.js"></script>
<script src="data/espn-draft.js"></script>
<script src="data/espn-history.js"></script>
<script src="data/espn-schedule.js"></script>
<script src="data/adp-data.js"></script>
<script src="data/player-positions.js"></script>
<script src="data/player-names.js"></script>
<script src="data/players.js"></script>
<script src="data/keepers.js"></script>
<script src="js/analytics.js"></script>
</body>
</html>
