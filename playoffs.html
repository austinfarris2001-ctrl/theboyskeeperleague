<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Playoff Stats - The Boys Keeper League</title>
<link rel="stylesheet" href="css/style.css">
<style>
.bracket-wrap { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; }
.bracket-round { display: flex; flex-direction: column; justify-content: space-around; min-width: 190px; flex-shrink: 0; }
.bracket-round-title {
  font-size: 11px; font-weight: 800; color: var(--blue); margin-bottom: 8px; text-align: center;
  text-transform: uppercase; letter-spacing: 0.6px;
}
.bracket-round.championship .bracket-round-title { color: #ffd54a; text-shadow: 0 0 10px rgba(255,213,74,0.5); }
.bracket-match {
  background: var(--panel); border: 2px solid var(--border); border-radius: 10px;
  padding: 6px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 3px;
}
.bracket-match.championship { border-color: #ffd54a; box-shadow: 0 0 14px rgba(255,213,74,0.3); }
.bracket-team {
  display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 6px;
  border-radius: 6px; white-space: nowrap;
}
.bracket-team .bt-avatar, .bracket-team .bt-avatar-fallback {
  width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; object-fit: cover;
}
.bracket-team .bt-avatar-fallback {
  background: var(--panel-2); display: flex; align-items: center; justify-content: center;
  font-size: 8px; font-weight: 700; color: var(--blue);
}
.bracket-team .bt-name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.bracket-team .bt-score { font-weight: 700; }
.bracket-team.winner { background: rgba(57,255,138,0.14); font-weight: 800; color: var(--green); }
.bracket-team.loser { color: var(--text-mute); opacity: 0.75; }
.bracket-match.championship .bracket-team.winner { background: rgba(255,213,74,0.16); color: #ffd54a; }
.bracket-page-layout { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
.bracket-side-panel { display: flex; flex-direction: column; gap: 20px; min-width: 260px; flex-shrink: 0; }
.side-panel-title { font-size: 12px; font-weight: 800; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px; text-align: center; }
.podium-spot .p-teamname { margin-top: -4px; margin-bottom: 6px; }
.podium-spot .p-player, .podium-spot .p-teamname {
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 148px;
  margin-left: auto; margin-right: auto;
}
.toilet-bowl-card {
  background: var(--panel); border: 2px solid var(--red); border-radius: 12px; padding: 10px 14px;
  text-align: center; box-shadow: 0 0 14px rgba(255,92,92,0.15); max-width: 150px;
}
.toilet-graphic { position: relative; width: 64px; height: 64px; margin: 0 auto 4px; }
.toilet-graphic .tb-emoji { font-size: 52px; line-height: 1; position: absolute; bottom: 0; left: 0; }
.toilet-graphic .team-avatar, .toilet-graphic .team-avatar-fallback {
  position: absolute; top: -2px; left: 50%; transform: translateX(-50%);
  width: 26px; height: 26px; border: 2px solid var(--red); z-index: 2;
}
.toilet-bowl-card .tb-owner {
  font-size: 13px; font-weight: 800; color: var(--red); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.toilet-bowl-card .tb-teamname {
  font-size: 10px; color: var(--text-mute); margin-top: 2px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.bracket-multiweek-note { font-size: 9px; color: var(--text-mute); text-align: center; margin-top: -4px; margin-bottom: 6px; }
</style>
</head>
<body>
<div class="page">

  <div class="page-header">
    <h1>Playoff Stats</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="stats.html">Season Stats</a>
      <a href="playoffs.html" class="active">Playoff Stats</a>
      <a href="draft.html">Draft History</a>
      <a href="keepers.html">Keepers</a>
      <a href="misses.html">Analytics</a>
    </nav>
  </div>

  <div class="filter-bar" id="playoff-season-bar"></div>
  <div class="filter-bar">
    <button id="playoff-select-all-btn" class="filter-btn small-btn">Select all</button>
    <button id="playoff-deselect-all-btn" class="filter-btn small-btn">Deselect all</button>
  </div>
  <div class="filter-bar" id="playoff-mode-bar">
    <button class="filter-btn active" data-mode="individual">Individual</button>
    <button class="filter-btn" data-mode="cumulative">Cumulative</button>
  </div>
  <div class="filter-bar" style="align-items:center;">
    <span style="font-size:13px; color:var(--text-mute);">Sort by:</span>
    <select id="playoff-sort-select" class="sort-select"></select>
  </div>

  <div id="playoff-loading" class="empty-note">Select at least one season above.</div>
  <div id="playoff-content"></div>

</div>

<script src="data/owners.js"></script>
<script src="data/espn-history.js"></script>
<script src="data/espn-playoffs.js"></script>
<script src="js/playoffs.js"></script>
</body>
</html>
